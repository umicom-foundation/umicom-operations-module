schema: umicom.application.v1

application:
  id: org.umicom.operations
  name: Umicom Operations
  short_name: Operations
  version: 0.1.0
  executable: umicom-operations-console
  aliases: [operations]

framework:
  minimum_version: 0.9.0
  compatible_major: 0

frontends:
  - console

entry:
  kind: workbench
  taskbar_group: system
  pinned_by_default: false
  default_layout: operations

capabilities:
  - umicom.operations
  - umicom.metrics
  - umicom.tracing
  - umicom.resilience
  - umicom.application.experience
  - umicom.application.federation

source_layout:
  product_root: src
  composition_root: src
  console_frontend: src/console

boundaries:
  owns_reusable_framework_logic: false
  owns_persistence: false
  consumes_framework_services: true
